<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Coast — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">CC</span>
    <div>
      <h1>Cover Coast</h1>
      <p>Turn your photo into GTA-style cover art</p>
    </div>
  </div>
  <div class="top-actions">
    <button id="undo" type="button" disabled>Undo</button>
    <button id="redo" type="button" disabled>Redo</button>
  </div>
</header>
<main class="app">
  <section class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="Cover preview"></canvas>
    <p class="hint">Click a panel to select it, drag to move its photo, scroll to zoom.</p>
    <div class="sizes" id="sizes" role="group" aria-label="Preview size"></div>
  </section>
  <aside class="controls">
    <section class="panel">
      <h2>Photo</h2>
      <label class="file-label">Upload a photo
        <input id="upload" type="file" accept="image/*">
      </label>
      <div class="samples" id="samples" role="group" aria-label="Sample photos"></div>
      <p class="row"><span id="panelLabel">Panel 1 of 3</span>
        <label class="zoom">Zoom
          <input id="zoom" type="range" min="50" max="300" value="100">
          <span id="zoomValue">100%</span>
        </label>
      </p>
    </section>
    <section class="panel">
      <h2>Layout</h2>
      <div class="picker" id="layouts" role="group" aria-label="Panel layout"></div>
    </section>
    <section class="panel">
      <h2>Colour grade</h2>
      <div class="picker grades" id="grades" role="group" aria-label="Colour grade"></div>
    </section>
    <section class="panel">
      <h2>Words</h2>
      <label>Title <input id="title" type="text" maxlength="30" value="VICE CITY NIGHTS"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="a cover coast story"></label>
      <label>Badge <input id="badge" type="text" maxlength="18" value="COVER COAST"></label>
      <div class="heat" id="heat" role="group" aria-label="Heat stars"></div>
    </section>
    <section class="panel">
      <h2>Export PNG</h2>
      <div class="exports">
        <button id="export-square" type="button">PNG 1080 x 1080</button>
        <button id="export-story" type="button">PNG 1080 x 1350</button>
        <button id="export-wide" type="button">PNG 1920 x 1080</button>
      </div>
      <p id="status" role="status"></p>
    </section>
  </aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
